<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <title>管理员登录</title>
  <style>
    body {
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      font-family: system-ui;
      background: #f5f5f5;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3>鲁班导航 · 登录</h3>
    <input id="pwd" type="password" placeholder="请输入访问密码" />
    <button onclick="login()">登录</button>
    <p id="msg" style="color:red;"></p>
  </div>

  <script>
    async function login() {
      const pwd = document.getElementById('pwd').value
      const res = await fetch('/api/login', {
        method: 'POST',
        body: JSON.stringify({ pwd }),
      })
      if (res.ok) {
        document.cookie = 'admin_auth=ok; path=/'
        location.href = '/'
      } else {
        document.getElementById('msg').innerText = '密码错误'
      }
    }
  </script>
</body>
</html>
